<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        /* Make the entire page black and hide overflow */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            /* Prevent text selection */
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* An invisible overlay to capture the first tap */
        #tap-target {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="tap-target"></div>

    <script>
        const tapTarget = document.getElementById('tap-target');
        const audio = new Audio('gg.mp3');
        
        // Maximize the HTML5 audio element's volume (relative to system volume)
        audio.volume = 1.0;
        audio.loop = true; // Loops the audio continuously

        tapTarget.addEventListener('click', function() {
            // Attempt to go Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) { /* IE11 */
                document.documentElement.msRequestFullscreen();
            }

            // Play the audio
            audio.play().catch(error => {
                console.log("Audio playback failed:", error);
            });
            
            // Remove the tap target so it doesn't interfere anymore
            tapTarget.style.display = 'none';
        });
    </script>
</body>
</html>
